name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_RELAY_URL: wss://relay.woodpeckeros.com
      - name: Typecheck connector
        run: npm run typecheck -w woodpeckeros
      - name: Build connector
        run: npm run build -w woodpeckeros
