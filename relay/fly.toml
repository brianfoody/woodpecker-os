# fly.toml app configuration file generated for woodpecker-relay on 2026-07-08T14:12:42+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'woodpecker-relay'
primary_region = 'syd'

[build]
[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 9000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
